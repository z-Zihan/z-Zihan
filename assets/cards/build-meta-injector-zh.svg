<svg xmlns="http://www.w3.org/2000/svg" width="300" height="180" viewBox="0 0 300 180" role="img" aria-labelledby="title desc">
  <title id="title">build-meta-injector</title>
  <desc id="desc">为 Vite、Webpack、Rollup、Rspack 与 esbuild 统一注入构建元数据。</desc>
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop class="bg-a" offset="0"/>
      <stop class="bg-b" offset="1"/>
    </linearGradient>
    <linearGradient id="tileGrad" x1="0" y1="0" x2="1" y2="1">
      <stop class="tile-a" offset="0"/>
      <stop class="tile-b" offset="1"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0" y1="0" x2="1" y2="1">
      <stop class="ic-a" offset="0"/>
      <stop class="ic-b" offset="1"/>
    </linearGradient>
    <filter id="blobBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <style>
      .bg-a { stop-color: #f7f9fc; }
      .bg-b { stop-color: #edf3fb; }
      .tile-a { stop-color: #fef3dd; }
      .tile-b { stop-color: #fce4ad; }
      .ic-a { stop-color: #d97706; }
      .ic-b { stop-color: #fbbf24; }
      .card { fill: url(#cardGrad); stroke: #d7e0ec; }
      .edge-hi { stroke: #ffffff; stroke-opacity: 0.55; }
      .blob { fill: url(#iconGrad); opacity: 0.07; }
      .tile { fill: url(#tileGrad); }
      .icon { fill: none; stroke: url(#iconGrad); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
      .ext-link { fill: none; stroke: #f59e0b; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; opacity: 0.85; }
      .ext-link-bg { fill: url(#iconGrad); opacity: 0.16; }
      .name { fill: #0f172a; font: 700 16px -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      .desc { fill: #57606a; font: 400 12px -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      .divider { stroke: #e2e8f0; }
      .chip-bg { fill: #fef3dd; }
      .chip-text { fill: #b45309; font: 600 10px -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      @media (prefers-color-scheme: dark) {
        .bg-a { stop-color: #161b22; }
        .bg-b { stop-color: #1a2029; }
        .tile-a { stop-color: #34281a; }
        .tile-b { stop-color: #3d2f18; }
        .ic-a { stop-color: #fbbf24; }
        .ic-b { stop-color: #fde68a; }
        .card { stroke: #30363d; }
        .edge-hi { stroke-opacity: 0.05; }
        .blob { opacity: 0.10; }
        .ext-link { stroke: #fcd34d; }
        .ext-link-bg { opacity: 0.26; }
        .name { fill: #e6edf3; }
        .desc { fill: #8b949e; }
        .divider { stroke: #242c38; }
        .chip-bg { fill: #34281a; }
        .chip-text { fill: #fcd34d; }
      }
    </style>
  </defs>
  <rect class="card" x="1" y="1" width="298" height="178" rx="18"/>
  <circle class="blob" cx="252" cy="130" r="42" filter="url(#blobBlur)"/>
  <path class="edge-hi" d="M13 2.2H287" stroke-width="1"/>
  <rect class="tile" x="14" y="16" width="42" height="42" rx="12"/>
  <g class="icon" transform="translate(22,37)"><path d="M12 3.2l7.6 4.3v8.6L12 20.4l-7.6-4.3V7.5z"/><path d="M12 11.8V3.2M12 11.8l7.6-4.3M12 11.8l-7.6-4.3"/></g>
  <circle class="ext-link-bg" cx="267.6" cy="21.6" r="14"/>
  <g class="ext-link" transform="translate(253.8,5.8) scale(1.4)"><path d="M8.5 15.5L15.5 8.5M9.5 8.5h6v6"/></g>
  <text class="name" x="68" y="43">build-meta-injector</text>
  <text class="desc" x="14" y="80">为 Vite、Webpack、Rollup、Rspack</text>
  <text class="desc" x="14" y="100">与 esbuild 统一注入构建元数据。</text>
  <line class="divider" x1="14" y1="114" x2="286" y2="122"/>
  <rect class="chip-bg" x="89.5" y="132" width="68.0" height="19" rx="9.5"/>
<text class="chip-text" x="99.5" y="145">JavaScript</text>
  <rect class="chip-bg" x="163.5" y="132" width="47.0" height="19" rx="9.5"/>
<text class="chip-text" x="173.5" y="145">CI/CD</text>
</svg>
