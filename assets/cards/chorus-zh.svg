<svg xmlns="http://www.w3.org/2000/svg" width="300" height="180" viewBox="0 0 300 180" role="img" aria-labelledby="title desc">
  <title id="title">Chorus</title>
  <desc id="desc">让 AI Agent 跨 CLI、设备与团队沟通协作的本地优先工作台。</desc>
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop class="bg-a" offset="0"/>
      <stop class="bg-b" offset="1"/>
    </linearGradient>
    <linearGradient id="tileGrad" x1="0" y1="0" x2="1" y2="1">
      <stop class="tile-a" offset="0"/>
      <stop class="tile-b" offset="1"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0" y1="0" x2="1" y2="1">
      <stop class="ic-a" offset="0"/>
      <stop class="ic-b" offset="1"/>
    </linearGradient>
    <filter id="blobBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <style>
      .bg-a { stop-color: #f7f9fc; }
      .bg-b { stop-color: #edf3fb; }
      .tile-a { stop-color: #efe7fd; }
      .tile-b { stop-color: #ddccfa; }
      .ic-a { stop-color: #7c3aed; }
      .ic-b { stop-color: #a78bfa; }
      .card { fill: url(#cardGrad); stroke: #d7e0ec; }
      .edge-hi { stroke: #ffffff; stroke-opacity: 0.55; }
      .blob { fill: url(#iconGrad); opacity: 0.07; }
      .tile { fill: url(#tileGrad); }
      .icon { fill: none; stroke: url(#iconGrad); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
      .ext-link { fill: none; stroke: #8b5cf6; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; opacity: 0.85; }
      .ext-link-bg { fill: url(#iconGrad); opacity: 0.16; }
      .name { fill: #0f172a; font: 700 16px -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      .desc { fill: #57606a; font: 400 12px -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      .divider { stroke: #e2e8f0; }
      .chip-bg { fill: #f0e9fe; }
      .chip-text { fill: #7c3aed; font: 600 10px -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      @media (prefers-color-scheme: dark) {
        .bg-a { stop-color: #161b22; }
        .bg-b { stop-color: #1a2029; }
        .tile-a { stop-color: #241f38; }
        .tile-b { stop-color: #2f2748; }
        .ic-a { stop-color: #a78bfa; }
        .ic-b { stop-color: #d8b4fe; }
        .card { stroke: #30363d; }
        .edge-hi { stroke-opacity: 0.05; }
        .blob { opacity: 0.10; }
        .ext-link { stroke: #c4b5fd; }
        .ext-link-bg { opacity: 0.26; }
        .name { fill: #e6edf3; }
        .desc { fill: #8b949e; }
        .divider { stroke: #242c38; }
        .chip-bg { fill: #241f38; }
        .chip-text { fill: #c4b5fd; }
      }
    </style>
  </defs>
  <rect class="card" x="1" y="1" width="298" height="178" rx="18"/>
  <circle class="blob" cx="252" cy="130" r="42" filter="url(#blobBlur)"/>
  <path class="edge-hi" d="M19 2.2H281" stroke-width="1"/>
  <rect class="tile" x="20" y="20" width="44" height="44" rx="12"/>
  <g class="icon" transform="translate(30,30)"><circle cx="12" cy="4.8" r="2.3"/><circle cx="4.7" cy="18.1" r="2.3"/><circle cx="19.3" cy="18.1" r="2.3"/><path d="M10.5 6.7L6.2 16.1M13.5 6.7l4.3 9.4M6.9 18.1h10.2"/></g>
  <circle class="ext-link-bg" cx="267.6" cy="25.6" r="14"/>
  <g class="ext-link" transform="translate(250.8,8.8) scale(1.4)"><path d="M8.5 15.5L15.5 8.5M9.5 8.5h6v6"/></g>
  <text class="name" x="76" y="47">Chorus</text>
  <text class="desc" x="20" y="88">让 AI Agent 跨 CLI、设备与团队</text>
  <text class="desc" x="20" y="108">沟通协作的本地优先工作台。</text>
  <line class="divider" x1="20" y1="122" x2="280" y2="122"/>
  <rect class="chip-bg" x="65.0" y="138" width="72.0" height="22" rx="11"/>
<text class="chip-text" x="75.0" y="153">TypeScript</text>
  <rect class="chip-bg" x="143.0" y="138" width="44.0" height="22" rx="11"/>
<text class="chip-text" x="153.0" y="153">Tauri</text>
  <rect class="chip-bg" x="193.0" y="138" width="42.0" height="22" rx="11"/>
<text class="chip-text" x="203.0" y="153">Rust</text>
</svg>
