<svg xmlns="http://www.w3.org/2000/svg" width="300" height="180" viewBox="0 0 300 180" role="img" aria-labelledby="title desc">
  <title id="title">Evir</title>
  <desc id="desc">自有模型驱动、可操作文件与终端、强调明确控制权的本地优先 Agent。</desc>
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop class="bg-a" offset="0"/>
      <stop class="bg-b" offset="1"/>
    </linearGradient>
    <linearGradient id="tileGrad" x1="0" y1="0" x2="1" y2="1">
      <stop class="tile-a" offset="0"/>
      <stop class="tile-b" offset="1"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0" y1="0" x2="1" y2="1">
      <stop class="ic-a" offset="0"/>
      <stop class="ic-b" offset="1"/>
    </linearGradient>
    <filter id="blobBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <style>
      .bg-a { stop-color: #f7f9fc; }
      .bg-b { stop-color: #edf3fb; }
      .tile-a { stop-color: #e3f8f2; }
      .tile-b { stop-color: #c7f1e4; }
      .ic-a { stop-color: #0d9488; }
      .ic-b { stop-color: #2dd4bf; }
      .card { fill: url(#cardGrad); stroke: #d7e0ec; }
      .edge-hi { stroke: #ffffff; stroke-opacity: 0.55; }
      .blob { fill: url(#iconGrad); opacity: 0.07; }
      .tile { fill: url(#tileGrad); }
      .icon { fill: none; stroke: url(#iconGrad); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
      .ext-link { fill: none; stroke: #14b8a6; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; opacity: 0.5; }
      .name { fill: #0f172a; font: 700 16px -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      .desc { fill: #57606a; font: 400 12px -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      .divider { stroke: #e2e8f0; }
      .chip-bg { fill: #e3f8f2; }
      .chip-text { fill: #0d9488; font: 600 10px -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      @media (prefers-color-scheme: dark) {
        .bg-a { stop-color: #161b22; }
        .bg-b { stop-color: #1a2029; }
        .tile-a { stop-color: #16302c; }
        .tile-b { stop-color: #163c36; }
        .ic-a { stop-color: #2dd4bf; }
        .ic-b { stop-color: #5eead4; }
        .card { stroke: #30363d; }
        .edge-hi { stroke-opacity: 0.05; }
        .blob { opacity: 0.10; }
        .ext-link { stroke: #5eead4; }
        .name { fill: #e6edf3; }
        .desc { fill: #8b949e; }
        .divider { stroke: #242c38; }
        .chip-bg { fill: #16302c; }
        .chip-text { fill: #5eead4; }
      }
    </style>
  </defs>
  <rect class="card" x="1" y="1" width="298" height="178" rx="18"/>
  <circle class="blob" cx="252" cy="130" r="42" filter="url(#blobBlur)"/>
  <path class="edge-hi" d="M19 2.2H281" stroke-width="1"/>
  <rect class="tile" x="20" y="20" width="44" height="44" rx="12"/>
  <g class="icon" transform="translate(30,30)"><rect x="3.2" y="5" width="17.6" height="14" rx="3"/><path d="M7 10.4l2.6 2.1-2.6 2.1"/><path d="M12.6 14.5h4.2"/></g>
  <g class="ext-link" transform="translate(258,16) scale(0.8)"><path d="M8.5 15.5L15.5 8.5M9.5 8.5h6v6"/></g>
  <text class="name" x="76" y="47">Evir</text>
  <text class="desc" x="20" y="88">自有模型驱动、可操作文件与终端、</text>
  <text class="desc" x="20" y="108">强调明确控制权的本地优先 Agent。</text>
  <line class="divider" x1="20" y1="122" x2="280" y2="122"/>
  <rect class="chip-bg" x="62.5" y="138" width="72.0" height="22" rx="11"/>
<text class="chip-text" x="72.5" y="153">TypeScript</text>
  <rect class="chip-bg" x="140.5" y="138" width="47.0" height="22" rx="11"/>
<text class="chip-text" x="150.5" y="153">React</text>
  <rect class="chip-bg" x="193.5" y="138" width="44.0" height="22" rx="11"/>
<text class="chip-text" x="203.5" y="153">Tauri</text>
</svg>
