<svg xmlns="http://www.w3.org/2000/svg" width="300" height="180" viewBox="0 0 300 180" role="img" aria-labelledby="title desc">
  <title id="title">LLM-101</title>
  <desc id="desc">从 0 开始建立从 AI、LLM 到 RAG、Agent、MCP、Coding Agent 的知识地图。</desc>
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop class="bg-a" offset="0"/>
      <stop class="bg-b" offset="1"/>
    </linearGradient>
    <linearGradient id="tileGrad" x1="0" y1="0" x2="1" y2="1">
      <stop class="tile-a" offset="0"/>
      <stop class="tile-b" offset="1"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0" y1="0" x2="1" y2="1">
      <stop class="ic-a" offset="0"/>
      <stop class="ic-b" offset="1"/>
    </linearGradient>
    <filter id="blobBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <style>
      .bg-a { stop-color: #f7f9fc; }
      .bg-b { stop-color: #edf3fb; }
      .tile-a { stop-color: #eaf1fd; }
      .tile-b { stop-color: #dbe7fb; }
      .ic-a { stop-color: #2563eb; }
      .ic-b { stop-color: #60a5fa; }
      .card { fill: url(#cardGrad); stroke: #d7e0ec; }
      .edge-hi { stroke: #ffffff; stroke-opacity: 0.55; }
      .blob { fill: url(#iconGrad); opacity: 0.07; }
      .tile { fill: url(#tileGrad); }
      .icon { fill: none; stroke: url(#iconGrad); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
      .ext-link { fill: none; stroke: #2563eb; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; opacity: 0.85; }
      .ext-link-bg { fill: url(#iconGrad); opacity: 0.16; }
      .name { fill: #0f172a; font: 700 16px -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      .desc { fill: #57606a; font: 400 12px -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      .divider { stroke: #e2e8f0; }
      .chip-bg { fill: #dbeafe; }
      .chip-text { fill: #2563eb; font: 600 10px -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      @media (prefers-color-scheme: dark) {
        .bg-a { stop-color: #161b22; }
        .bg-b { stop-color: #1a2029; }
        .tile-a { stop-color: #1d2433; }
        .tile-b { stop-color: #212a3d; }
        .ic-a { stop-color: #60a5fa; }
        .ic-b { stop-color: #93c5fd; }
        .card { stroke: #30363d; }
        .edge-hi { stroke-opacity: 0.05; }
        .blob { opacity: 0.10; }
        .ext-link { stroke: #93c5fd; }
        .ext-link-bg { opacity: 0.26; }
        .name { fill: #e6edf3; }
        .desc { fill: #8b949e; }
        .divider { stroke: #242c38; }
        .chip-bg { fill: #16233d; }
        .chip-text { fill: #93c5fd; }
      }
    </style>
  </defs>
  <rect class="card" x="1" y="1" width="298" height="178" rx="18"/>
  <circle class="blob" cx="252" cy="130" r="42" filter="url(#blobBlur)"/>
  <path class="edge-hi" d="M13 2.2H287" stroke-width="1"/>
  <rect class="tile" x="14" y="16" width="44" height="44" rx="12"/>
  <g class="icon" transform="translate(24.0,26.0)"><circle cx="12" cy="12" r="2.3"/><circle cx="5" cy="5.3" r="1.7"/><circle cx="19" cy="5.3" r="1.7"/><circle cx="5" cy="18.7" r="1.7"/><circle cx="19" cy="18.7" r="1.7"/><path d="M9.9 10.1L6.3 6.7M14.1 10.1l3.6-3.4M9.9 13.9l-3.6 3.4M14.1 13.9l3.6 3.4"/></g>
  <circle class="ext-link-bg" cx="267.6" cy="25.6" r="14"/>
  <g class="ext-link" transform="translate(250.8,8.8) scale(1.4)"><path d="M8.5 15.5L15.5 8.5M9.5 8.5h6v6"/></g>
  <text class="name" x="68" y="43">LLM-101</text>
  <text class="desc" x="14" y="80">从 0 开始建立从 AI、LLM 到 RAG、Agent、</text>
  <text class="desc" x="14" y="100">MCP、Coding Agent 的知识地图。</text>
  <line class="divider" x1="14" y1="122" x2="286" y2="122"/>
  <rect class="chip-bg" x="94.0" y="132" width="54.0" height="19" rx="9.5"/>
<text class="chip-text" x="104.0" y="159">Python</text>
  <rect class="chip-bg" x="156.0" y="132" width="50.0" height="19" rx="9.5"/>
<text class="chip-text" x="166.0" y="159">知识库</text>
</svg>
