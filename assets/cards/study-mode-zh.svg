<svg xmlns="http://www.w3.org/2000/svg" width="460" height="110" viewBox="0 0 460 110" role="img" aria-labelledby="title desc">
  <title id="title">study-mode</title>
  <desc id="desc">浏览器扩展：把摸鱼的标签页变成专注的学习空间。</desc>
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop class="bg-a" offset="0"/>
      <stop class="bg-b" offset="1"/>
    </linearGradient>
    <linearGradient id="tileGrad" x1="0" y1="0" x2="1" y2="1">
      <stop class="tile-a" offset="0"/>
      <stop class="tile-b" offset="1"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0" y1="0" x2="1" y2="1">
      <stop class="ic-a" offset="0"/>
      <stop class="ic-b" offset="1"/>
    </linearGradient>
    <filter id="blobBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <style>
      .bg-a { stop-color: #f8fafc; }
      .bg-b { stop-color: #eef2f8; }
      .tile-a { stop-color: #e0f2fe; }
      .tile-b { stop-color: #bae6fd; }
      .ic-a { stop-color: #0284c7; }
      .ic-b { stop-color: #38bdf8; }
      .card { fill: url(#cardGrad); stroke: #d9e1ec; }
      .blob { fill: url(#iconGrad); opacity: 0.08; }
      .tile { fill: url(#tileGrad); }
      .icon { fill: none; stroke: url(#iconGrad); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
      .ext-link { fill: none; stroke: #38bdf8; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; opacity: 0.65; }
      .name { fill: #0f172a; font: 700 17px -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      .desc { fill: #57606a; font: 400 12.5px -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      .divider { stroke: #e3e9f2; }
      .chip-bg { fill: #e0f2fe; }
      .chip-text { fill: #0284c7; font: 600 10px -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      @media (prefers-color-scheme: dark) {
        .bg-a { stop-color: #161b22; }
        .bg-b { stop-color: #1a2029; }
        .tile-a { stop-color: #12283a; }
        .tile-b { stop-color: #153349; }
        .ic-a { stop-color: #38bdf8; }
        .ic-b { stop-color: #7dd3fc; }
        .card { stroke: #30363d; }
        .blob { opacity: 0.11; }
        .ext-link { stroke: #7dd3fc; opacity: 0.7; }
        .name { fill: #e6edf3; }
        .desc { fill: #8b949e; }
        .divider { stroke: #242c38; }
        .chip-bg { fill: #12283a; }
        .chip-text { fill: #7dd3fc; }
      }
    </style>
  </defs>
  <rect class="card" x="1" y="1" width="458" height="108" rx="16"/>
  <circle class="blob" cx="416" cy="98" r="44" filter="url(#blobBlur)"/>
  <rect class="tile" x="16" y="25" width="52" height="52" rx="13"/>
  <g class="icon" transform="translate(26.5,26.8)"><rect x="3.5" y="5" width="17" height="12.5" rx="2.4"/><path d="M3.5 8.8h17"/><path d="M6.4 6.9h.01M9 6.9h.01M11.6 6.9h.01"/><path d="M9.4 21h5.2M12 17.5V21"/></g>
  <g class="ext-link" transform="translate(414,32)"><path d="M7 7H17M17 7V17M17 7L7 17"/></g>
  <text class="name" x="88" y="42">study-mode</text>
  <text class="desc" x="88" y="63">浏览器扩展：把摸鱼的标签页，</text>
  <text class="desc" x="88" y="80">变成安静专注的学习空间。Manifest V3。</text>
  <line class="divider" x1="88" y1="94" x2="404" y2="94"/>
  <rect class="chip-bg" x="88.0" y="97" width="36.0" height="19" rx="9.5"/>
  <text class="chip-text" x="96.0" y="110">扩展</text>
  <rect class="chip-bg" x="132.0" y="97" width="34.3" height="19" rx="9.5"/>
  <text class="chip-text" x="140.0" y="110">MV3</text>
  <rect class="chip-bg" x="174.3" y="97" width="77.0" height="19" rx="9.5"/>
  <text class="chip-text" x="182.3" y="110">TypeScript</text>
</svg>