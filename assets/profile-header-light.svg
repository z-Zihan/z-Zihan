<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300" role="img" aria-labelledby="title desc">
  <title id="title">Zihan — frontend engineer and AI product builder</title>
  <desc id="desc">Building local-first AI products and the interfaces that make them useful.</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="1" stop-color="#edf3fb"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#dce5f0" stroke-width="1" opacity=".48"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect x="1" y="1" width="918" height="298" rx="22" fill="url(#wash)" stroke="#d7e0ec" stroke-width="2"/>
  <rect x="1" y="1" width="918" height="298" rx="22" fill="url(#grid)"/>
  <circle cx="795" cy="82" r="86" fill="#2563eb" opacity=".08" filter="url(#glow)"/>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <rect x="48" y="42" width="300" height="28" rx="14" fill="#ffffff" stroke="#d7e0ec"/>
    <circle cx="65" cy="56" r="4" fill="#16a34a"/>
    <text x="78" y="61" font-size="12" font-weight="700" letter-spacing="1.2" fill="#526178">FRONTEND ENGINEER · AI BUILDER</text>
  </g>

  <text x="46" y="148" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="76" font-weight="800" letter-spacing="-4" fill="#111827">ZIHAN</text>
  <rect x="48" y="166" width="82" height="5" rx="2.5" fill="url(#signal)"/>
  <text x="48" y="204" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20" font-weight="650" fill="#111827">Building local-first AI products</text>
  <text x="48" y="232" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20" fill="#526178">and the interfaces that make them useful.</text>

  <g transform="translate(614 46)" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <rect width="258" height="206" rx="16" fill="#ffffff" stroke="#d7e0ec" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="4" fill="#ef4444"/>
    <circle cx="34" cy="20" r="4" fill="#f59e0b"/>
    <circle cx="48" cy="20" r="4" fill="#16a34a"/>
    <path d="M0 39H258" stroke="#d7e0ec"/>
    <text x="20" y="68" font-size="12" fill="#526178">$ current_focus</text>
    <text x="20" y="94" font-size="13" font-weight="700" fill="#2563eb">local-first AI</text>
    <text x="20" y="117" font-size="13" font-weight="700" fill="#0e7490">agent collaboration</text>
    <text x="20" y="140" font-size="13" font-weight="700" fill="#111827">interface systems</text>
    <path d="M20 165H238" stroke="#d7e0ec"/>
    <circle cx="29" cy="184" r="5" fill="#16a34a"/>
    <text x="43" y="189" font-size="11" fill="#526178">building in public</text>
  </g>
</svg>