<svg xmlns="http://www.w3.org/2000/svg" lang="zh-CN" width="920" height="300" viewBox="0 0 920 300" role="img" aria-labelledby="title desc">
  <title id="title">子涵 — AI Agent 工程师与产品构建者</title>
  <desc id="desc">构建本地优先的 AI 产品，让复杂技术变得清晰、可控、真正有用。</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="1" stop-color="#edf3fb"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#dce5f0" stroke-width="1" opacity=".48"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <style>
    .hero-copy { animation: rise-in 280ms cubic-bezier(.23,1,.32,1) both; }
    .hero-terminal { animation: terminal-in 280ms cubic-bezier(.23,1,.32,1) 60ms both; }
    .focus-row { animation: row-in 220ms cubic-bezier(.23,1,.32,1) both; }
    .focus-1 { animation-delay: 110ms; }
    .focus-2 { animation-delay: 160ms; }
    .focus-3 { animation-delay: 210ms; }
    .chip { animation: row-in 220ms cubic-bezier(.23,1,.32,1) both; }
    .chip-1 { animation-delay: 90ms; }
    .chip-2 { animation-delay: 140ms; }
    .chip-3 { animation-delay: 190ms; }
    .live-dot { transform-box: fill-box; transform-origin: center; animation: breathe 2.4s cubic-bezier(.77,0,.175,1) infinite; }
    .cursor { animation: blink 1.2s steps(1,end) infinite; }
    @keyframes rise-in { from { opacity: .82; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes terminal-in { from { opacity: .82; transform: translateX(8px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes row-in { from { opacity: .78; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes breathe { 0%,100% { opacity: .55; transform: scale(.92); } 50% { opacity: 1; transform: scale(1); } }
    @keyframes blink { 0%,48% { opacity: 1; } 49%,100% { opacity: 0; } }
    @keyframes fade-in { from { opacity: .88; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .hero-copy,.hero-terminal,.focus-row,.chip { animation: fade-in 160ms cubic-bezier(.23,1,.32,1) both; }
      .live-dot,.cursor { animation: none; }
    }
</style>
  </defs>
  <rect x="1" y="1" width="918" height="298" rx="22" fill="url(#wash)" stroke="#d7e0ec" stroke-width="2"/>
  <rect x="1" y="1" width="918" height="298" rx="22" fill="url(#grid)"/>
  <circle cx="795" cy="82" r="86" fill="#2563eb" opacity=".08" filter="url(#glow)"/>

  <g class="hero-copy">
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'PingFang SC','Microsoft YaHei',monospace">
    <rect x="48" y="42" width="284" height="28" rx="14" fill="#ffffff" stroke="#d7e0ec"/>
    <circle cx="65" cy="56" r="4" fill="#16a34a"/>
    <text x="78" y="61" font-size="12" font-weight="700" letter-spacing="1.2" fill="#526178">AI AGENT 工程师 · 产品构建者</text>
  </g>

  <text x="46" y="148" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="72" font-weight="800" letter-spacing="3" fill="#111827">子涵</text>
  <rect x="48" y="166" width="82" height="5" rx="2.5" fill="url(#signal)"/>
  <text x="48" y="204" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="650" fill="#111827">构建本地优先的 AI 产品</text>
  <text x="48" y="232" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" fill="#526178">让复杂技术变得清晰、可控、真正有用。</text>
  </g>

  <g transform="translate(614 46)"><g class="hero-terminal" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'PingFang SC','Microsoft YaHei',monospace">
    <rect width="258" height="206" rx="16" fill="#ffffff" stroke="#d7e0ec" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="4" fill="#ef4444"/>
    <circle cx="34" cy="20" r="4" fill="#f59e0b"/>
    <circle cx="48" cy="20" r="4" fill="#16a34a"/>
    <path d="M0 39H258" stroke="#d7e0ec"/>
    <text x="20" y="68" font-size="12" fill="#526178">$ 当前专注<tspan class="cursor">_</tspan></text>
    <text class="focus-row focus-1" x="20" y="94" font-size="13" font-weight="700" fill="#2563eb">本地优先 AI</text>
    <text class="focus-row focus-2" x="20" y="117" font-size="13" font-weight="700" fill="#0e7490">Agent 协作</text>
    <text class="focus-row focus-3" x="20" y="140" font-size="13" font-weight="700" fill="#111827">界面系统</text>
    <path d="M20 165H238" stroke="#d7e0ec"/>
    <circle class="live-dot" cx="29" cy="184" r="5" fill="#16a34a"/>
    <text x="43" y="189" font-size="11" fill="#526178">持续构建中</text>
  </g></g>
</svg>