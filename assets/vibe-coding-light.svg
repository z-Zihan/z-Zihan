<svg xmlns="http://www.w3.org/2000/svg" width="840" height="200" viewBox="0 0 840 200" fill="none">
  <defs>
    <linearGradient id="bgGradL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f6f8fa"/>
    </linearGradient>
    <linearGradient id="accentGradL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="barGradL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <rect width="840" height="200" rx="16" fill="url(#bgGradL)" stroke="#d0d7de" stroke-width="1"/>

  <text x="30" y="42" font-family="SF Pro Display, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#24292f">
    ⚡ Vibe Coding Stats
  </text>
  <rect x="30" y="50" width="120" height="3" rx="1.5" fill="url(#accentGradL)">
    <animate attributeName="width" values="0;120;120" dur="1.5s" fill="freeze"/>
  </rect>

  <text x="30" y="85" font-family="SF Pro Display, -apple-system, sans-serif" font-size="13" fill="#656d76">⭐ Total Stars</text>
  <text x="30" y="110" font-family="SF Pro Display, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#24292f">
    6
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.3s" fill="freeze"/>
  </text>

  <text x="180" y="85" font-family="SF Pro Display, -apple-system, sans-serif" font-size="13" fill="#656d76">📦 Repos</text>
  <text x="180" y="110" font-family="SF Pro Display, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#24292f">
    2
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.5s" fill="freeze"/>
  </text>

  <text x="300" y="85" font-family="SF Pro Display, -apple-system, sans-serif" font-size="13" fill="#656d76">👥 Followers</text>
  <text x="300" y="110" font-family="SF Pro Display, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#24292f">
    3
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.7s" fill="freeze"/>
  </text>

  <text x="440" y="85" font-family="SF Pro Display, -apple-system, sans-serif" font-size="13" fill="#656d76">📅 Years</text>
  <text x="440" y="110" font-family="SF Pro Display, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#24292f">
    7+
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.9s" fill="freeze"/>
  </text>

  <line x1="30" y1="130" x2="810" y2="130" stroke="#d0d7de" stroke-width="1"/>

  <text x="30" y="155" font-family="SF Pro Display, -apple-system, sans-serif" font-size="13" fill="#656d76">🔧 Top Languages</text>

  <text x="30" y="180" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#24292f">Python</text>
  <rect x="100" y="170" width="0" height="12" rx="6" fill="url(#barGradL)">
    <animate attributeName="width" values="0;200" dur="1.2s" begin="1.1s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" keyTimes="0;1"/>
  </rect>
  <text x="310" y="180" font-family="SF Pro Display, -apple-system, sans-serif" font-size="11" fill="#656d76">
    100%
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.2s" fill="freeze"/>
  </text>

  <circle cx="815" cy="30" r="4" fill="#06b6d4">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="788" y="42" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#656d76" text-anchor="end">LIVE</text>

  <rect x="0" y="196" width="840" height="4" rx="2" fill="url(#accentGradL)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
