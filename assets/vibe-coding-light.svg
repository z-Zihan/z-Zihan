<svg xmlns="http://www.w3.org/2000/svg" width="840" height="210" viewBox="0 0 840 210" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f6f8fa"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="840" height="210" rx="16" fill="url(#bgGrad)" stroke="#d0d7de" stroke-width="1"/>

  <text x="30" y="42" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#24292f">⚡ Vibe Coding Stats</text>
  <rect x="30" y="50" width="0" height="3" rx="1.5" fill="url(#accent)">
    <animate attributeName="width" values="0;120" dur="1s" fill="freeze"/>
  </rect>

  <text x="30" y="85" font-family="system-ui, sans-serif" font-size="13" fill="#656d76">⭐ Total Stars</text>
  <text x="30" y="110" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#24292f" filter="url(#glow)">6</text>

  <text x="180" y="85" font-family="system-ui, sans-serif" font-size="13" fill="#656d76">👥 Followers</text>
  <text x="180" y="110" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#24292f" filter="url(#glow)">6</text>

  <text x="340" y="85" font-family="system-ui, sans-serif" font-size="13" fill="#656d76">📦 Repos</text>
  <text x="340" y="110" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#24292f" filter="url(#glow)">2</text>

  <text x="500" y="85" font-family="system-ui, sans-serif" font-size="13" fill="#656d76">📅 GitHub Since</text>
  <text x="500" y="110" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#24292f" filter="url(#glow)">7 years</text>

  <text x="640" y="85" font-family="system-ui, sans-serif" font-size="13" fill="#656d76">🕐 Updated</text>
  <text x="640" y="110" font-family="system-ui, sans-serif" font-size="13" fill="#656d76">2026-07-25</text>

  <line x1="30" y1="132" x2="810" y2="132" stroke="#d0d7de" stroke-width="1"/>

  <text x="30" y="158" font-family="system-ui, sans-serif" font-size="13" fill="#656d76">🔧 Languages</text>

  <text x="30" y="172" font-family="system-ui, sans-serif" font-size="12" fill="#24292f">Python</text>
  <rect x="100" y="164" width="200" height="10" rx="5" fill="#3776AB">
    <animate attributeName="width" values="0;200" dur="1s" begin="1.1s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" keyTimes="0;1"/>
  </rect>
  <text x="308" y="172" font-family="system-ui, sans-serif" font-size="11" fill="#656d76">100%</text>

  <circle cx="815" cy="30" r="4" fill="#06b6d4">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="788" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#656d76" text-anchor="end">LIVE</text>

  <rect x="0" y="206" width="840" height="4" rx="2" fill="url(#accent)" opacity="0.6">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>